name: Desktop

on:
  workflow_call:
    inputs:
      version_name:
        type: string
        default: "2.0.0"

env:
  QT_VER: 6.8.2

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake rsync wget file \
            libgl1-mesa-dev libfontconfig1 libfreetype6 \
            libxkbcommon-dev libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1 libxcb-util1
      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ~/Qt
          key: qt-desktop-${{ env.QT_VER }}-ose-webengine-v1
      - name: Install Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --user aqtinstall
          python3 -m aqt install-qt linux desktop "$QT_VER" linux_gcc_64 \
            -m qtwebengine qtwebview qtwebchannel qtpositioning -O "$HOME/Qt"
      - name: Cache AppImage tools
        uses: actions/cache@v4
        with:
          path: build/appimage-tools
          key: appimage-tools-ose
      - name: Build
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          QT_ROOT="$HOME/Qt/$QT_VER/gcc_64"
          export PATH="$QT_ROOT/bin:$PATH"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT"
          cmake --build build --target opensolarenergy -j"$(nproc)"
          QT_ROOT="$QT_ROOT" VERSION_NAME="$VERSION_NAME" bash scripts/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: opensolarenergy-appimage
          path: OpenSolarEnergy-*-x86_64.AppImage
