name: Android

on:
  workflow_call:
    inputs:
      version_name:
        type: string
        default: "2.0.0"
      version_code:
        type: string
        default: "200"
      require_release_key:
        type: boolean
        default: false
    secrets:
      ANDROID_KEYSTORE_B64:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEYSTORE_PASS:
        required: false

env:
  QT_VER: 6.8.2
  NDK_VER: 26.1.10909125
  BUILD_TOOLS_VER: 35.0.0

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Outils
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake rsync
      - name: Android NDK
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;${BUILD_TOOLS_VER}" "ndk;${NDK_VER}"
      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ~/Qt
          key: qt-${{ env.QT_VER }}-ose-android-webview
      - name: Install Qt
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          python3 -m pip install --user aqtinstall
          python3 -m aqt install-qt linux desktop "$QT_VER" linux_gcc_64 -O "$HOME/Qt"
          python3 -m aqt install-qt linux android "$QT_VER" android_arm64_v8a -m qtwebview -O "$HOME/Qt"
      - name: Vérifier clé release
        if: inputs.require_release_key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "::error::Secret ANDROID_KEYSTORE_B64 manquant"; exit 1; }
      - name: Build APK
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          OUT: ${{ github.workspace }}/opensolarenergy-arm64.apk
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STOREPASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: SDK_ROOT="$ANDROID_SDK_ROOT" bash scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: opensolarenergy-arm64-apk
          path: opensolarenergy-arm64.apk
