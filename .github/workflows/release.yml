name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: |
          echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

  apk:
    needs: version
    uses: ./.github/workflows/android.yml
    with:
      version_name: ${{ needs.version.outputs.name }}
      version_code: ${{ needs.version.outputs.code }}
      require_release_key: true
    secrets: inherit

  appimage:
    needs: version
    uses: ./.github/workflows/desktop.yml
    with:
      version_name: ${{ needs.version.outputs.name }}

  publish:
    needs: [version, apk, appimage]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Notes du tag
        run: |
          git fetch --force --tags origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          NOTES="$(git tag -l --format='%(contents)' "$GITHUB_REF_NAME")"
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="Port Qt natif, mises à jour auto comme Colo Course."
          fi
          {
            echo "NOTES<<OSE_EOF"
            printf '%s\n' "$NOTES"
            echo "OSE_EOF"
          } >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          pattern: opensolarenergy-*
          merge-multiple: true
      - name: Renommer APK
        run: mv opensolarenergy-arm64.apk "opensolarenergy-${GITHUB_REF_NAME}-arm64.apk"
      - name: Publier Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="opensolarenergy-${GITHUB_REF_NAME}-arm64.apk"
          APPIMAGE="$(ls OpenSolarEnergy-*-x86_64.AppImage | head -1)"
          {
            printf '%s\n\n---\n\n' "$NOTES"
            cat <<'EOF'
          ## Installation

          **Linux x86-64** — `chmod +x OpenSolarEnergy-*.AppImage && ./OpenSolarEnergy-*.AppImage`

          **Android arm64** — installer l'APK (mise à jour in-app proposée automatiquement).

          L'AppImage Electron reste disponible sur les releases antérieures ; à partir de v2.0.0,
          l'AppImage Qt remplace le binaire desktop recommandé.
          EOF
          } > notes.md
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK" "$APPIMAGE" --clobber
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" "$APK" "$APPIMAGE" \
            --title "Open Solar Energy $GITHUB_REF_NAME" \
            --notes-file notes.md
