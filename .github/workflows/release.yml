name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à publier (ex. v2.0.40)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.v.outputs.name }}
      code: ${{ steps.v.outputs.code }}
      ref: ${{ steps.v.outputs.ref }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ inputs.tag }}"
          else
            REF="${GITHUB_REF_NAME}"
          fi
          REF="${REF#refs/tags/}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ steps.pick.outputs.ref }}
      - id: v
        run: |
          REF="${{ steps.pick.outputs.ref }}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          NAME="${REF#v}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          # versionCode marketing : 2.0.60 → 20060 (monotone, aligné versionName).
          # Ne plus utiliser git rev-list (opaque, et < codes locaux type 260).
          IFS=. read -r MA MI PA _ <<< "${NAME}."
          MA=${MA:-0}; MI=${MI:-0}; PA=${PA:-0}
          CODE=$((10#$MA * 10000 + 10#$MI * 100 + 10#$PA))
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionCode Android = $CODE (depuis $NAME)"

  apk:
    needs: version
    uses: ./.github/workflows/android.yml
    with:
      version_name: ${{ needs.version.outputs.name }}
      version_code: ${{ needs.version.outputs.code }}
      require_release_key: true
    secrets: inherit

  appimage:
    needs: version
    uses: ./.github/workflows/desktop.yml
    with:
      version_name: ${{ needs.version.outputs.name }}

  publish:
    needs: [version, apk, appimage]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.version.outputs.ref }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.ref }}
      - name: Notes du tag
        run: |
          git fetch --force --tags origin "refs/tags/${TAG}:refs/tags/${TAG}" || true
          NOTES="$(git tag -l --format='%(contents)' "$TAG")"
          if [ -z "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            NOTES="Port Qt natif, mises à jour automatiques via GitHub Releases."
          fi
          {
            echo "NOTES<<OSE_EOF"
            printf '%s\n' "$NOTES"
            echo "OSE_EOF"
          } >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v5
        with:
          pattern: opensolarenergy-*
          merge-multiple: true
      - name: Renommer APK
        run: mv opensolarenergy-arm64.apk "opensolarenergy-${TAG}-arm64.apk"
      - name: Publier Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="opensolarenergy-${TAG}-arm64.apk"
          APPIMAGE="$(ls OpenSolarEnergy-*-x86_64.AppImage 2>/dev/null | head -1)"
          [ -n "$APPIMAGE" ] || { echo "AppImage introuvable" >&2; exit 1; }
          [ -f "$APK" ] || { echo "APK introuvable : $APK" >&2; exit 1; }
          {
            printf '%s\n\n' "$NOTES"
            printf -- '---\n\n'
            cat <<'EOF'
          ## Installation

          **PC / Linux (x86-64)** — `chmod +x OpenSolarEnergy-*.AppImage && ./OpenSolarEnergy-*.AppImage`

          **Android (arm64)** — installer l'APK ; l'app propose les mises à jour automatiquement
          (téléchargement + installation in-app), signature stable pour installer par-dessus.

          L'AppImage Qt est le binaire desktop recommandé à partir de v2.0.0.
          EOF
          } > notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$APPIMAGE" \
              --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Open Solar Energy $TAG" \
              --notes-file notes.md
          else
            gh release create "$TAG" "$APK" "$APPIMAGE" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Open Solar Energy $TAG" \
              --notes-file notes.md
          fi
